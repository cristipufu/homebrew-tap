name: Check Strata

on:
  push:
    branches: [main]
    paths: ["Casks/strata.rb", "scripts/*strata*", "tests/*strata*", ".github/workflows/*strata.yml"]
  pull_request:
    paths: ["Casks/strata.rb", "scripts/*strata*", "tests/*strata*", ".github/workflows/*strata.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release validation
        run: python3 -m unittest discover -s tests
      - name: Check installation and uninstallation
        run: bash scripts/check-strata.sh
