name: Check Ghostback
on:
  push:
    branches: [main]
    paths: ["Formula/ghostback.rb", "scripts/*ghostback*", "tests/*ghostback*", ".github/workflows/*ghostback.yml"]
  pull_request:
    paths: ["Formula/ghostback.rb", "scripts/*ghostback*", "tests/*ghostback*", ".github/workflows/*ghostback.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ruby tests/test_update_ghostback.rb
      - run: bash scripts/check-ghostback.sh
